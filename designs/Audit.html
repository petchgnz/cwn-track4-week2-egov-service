<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Audit Trail</title>
<script src="./support.js"></script>
</head>
<body>
<script type="text/x-dc-template">
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0;background:#F3F5F7}
*{box-sizing:border-box}
a{color:#0B5CAD}a:hover{color:#08457F}
.mono{font-family:'IBM Plex Mono',monospace}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:8px;font:600 15px/1 'IBM Plex Sans Thai',sans-serif;border:1px solid transparent;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn-primary{background:#0B5CAD;color:#fff}
.btn-secondary{background:#fff;color:#0B5CAD;border-color:#B9CCE0}
.label{font:600 14px/1.4 'IBM Plex Sans Thai',sans-serif;color:#3D4853}
.input{height:44px;border:1px solid #8E9AA6;border-radius:8px;padding:0 12px;font:500 15px/1 'IBM Plex Sans Thai',sans-serif;color:#13202B;background:#fff;width:100%}
.muted{color:#56616C;font-size:14px}
.t{width:100%;border-collapse:collapse;font-size:14px;min-width:1080px}
.t th{text-align:left;font-weight:600;font-size:13px;color:#56616C;padding:12px 14px;border-bottom:1px solid #DCE2E8;background:#F7F9FA;white-space:nowrap}
.t td{padding:12px 14px;border-bottom:1px solid #EDF0F3;vertical-align:top}
.t .mono{white-space:nowrap}
.t tr:last-child td{border-bottom:0}
.ev{display:inline-block;padding:3px 8px;border-radius:6px;font:600 12px/1.4 'IBM Plex Mono',monospace;background:#EDF1F4;color:#13202B;white-space:nowrap}
.ev-sens{background:#FDEBD3;color:#5E2B00}
.ev-adm{background:#EEEAFB;color:#3A2A7A}
.nav a{font-size:15px;font-weight:500;color:#3D4853;text-decoration:none;padding:10px 4px;border-bottom:3px solid transparent}
.nav a.on{color:#0B5CAD;border-bottom-color:#0B5CAD}
</style>
</helmet>
<div style="min-height: 1200px; background: #F3F5F7; font-family: 'IBM Plex Sans Thai', sans-serif; color: #13202B">
  <header style="background: #FFFFFF; border-bottom: 1px solid #DCE2E8">
    <div style="max-width: 1200px; margin: 0 auto; padding: 10px 24px 0; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 32px">
      <a href="Main.html" style="display: flex; align-items: center; gap: 12px; text-decoration: none; color: #13202B; padding-bottom: 10px">
        <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="19" fill="#0B5CAD"></circle><path d="M11 17h18M12 28h16M13 17v9M18 17v9M22 17v9M27 17v9M10 31h20M20 9l10 6H10z" stroke="#fff" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round"></path></svg>
        <span style="display: flex; flex-direction: column; line-height: 1.25"><strong style="font-size: 17px">e-Service กลาง</strong><span style="font-size: 13px; color: #56616C">ผู้ตรวจสอบภายใน</span></span>
      </a>
      <nav class="nav" aria-label="เมนูผู้ตรวจสอบ" style="display: flex; gap: 24px; align-self: flex-end"><a href="Audit.html" class="on" aria-current="page">Audit Trail</a></nav>
      <div style="margin-left: auto; display: flex; align-items: center; gap: 16px; padding-bottom: 10px">
        <span data-testid="user-name" data-role="auditor" style="font-size: 15px; font-weight: 600">ผู้ตรวจสอบภายใน</span>
        <a href="Main.html" style="font-size: 15px">ออกจากระบบ</a>
      </div>
    </div>
  </header>

  <main style="max-width: 1200px; margin: 0 auto; padding: 28px 24px 56px; display: flex; flex-direction: column; gap: 20px">
    <div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; justify-content: space-between">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <h1 style="margin: 0; font-size: 28px">ประวัติการทำรายการ (Audit Trail)</h1>
        <p class="muted" style="margin: 0; font-size: 15px; display: flex; align-items: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>บันทึกเพิ่มได้อย่างเดียว ไม่มีใครแก้ไขหรือลบได้ รวมถึงผู้ดูแลระบบ</p>
      </div>
      <button type="button" class="btn btn-secondary" data-testid="audit-export-csv-btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"></path></svg>ส่งออก CSV</button>
    </div>

    <form style="background: #FFFFFF; border: 1px solid #DCE2E8; border-radius: 14px; padding: 18px; display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; align-items: end">
      <div style="display: flex; flex-direction: column; gap: 6px"><label class="label" for="f-actor">ผู้ทำรายการ</label><input id="f-actor" class="input" data-testid="audit-filter-actor" placeholder="เช่น off.reg1"></div>
      <div style="display: flex; flex-direction: column; gap: 6px"><label class="label" for="f-ev">เหตุการณ์</label>
        <select id="f-ev" class="input" data-testid="audit-filter-event"><option value="">ทั้งหมด</option><option>STAFF_LOGIN</option><option>CLAIM</option><option>RETURN</option><option>FORWARD</option><option>APPROVE</option><option>REJECT</option><option>ISSUE</option><option>UNMASK</option><option>EXPORT</option><option>ADMIN_CHANGE</option></select></div>
      <div style="display: flex; flex-direction: column; gap: 6px"><label class="label" for="f-from">ตั้งแต่วันที่</label><input id="f-from" class="input" type="date" value="2026-12-01" data-testid="audit-filter-from"></div>
      <div style="display: flex; flex-direction: column; gap: 6px"><label class="label" for="f-to">ถึงวันที่</label><input id="f-to" class="input" type="date" value="2026-12-01" data-testid="audit-filter-to"></div>
      <button type="button" class="btn btn-primary" data-testid="audit-apply-btn">ค้นหา</button>
    </form>

    <div style="display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap">
      <span style="font-size: 15px">พบ <strong data-testid="audit-count">10</strong> รายการ · ใหม่ → เก่า</span>
      <span class="muted">ช่วงวันที่นับรวมวันเริ่มและวันสิ้นสุด ตามเวลาไทย</span>
    </div>

    <section aria-label="ตาราง Audit" style="background: #FFFFFF; border: 1px solid #DCE2E8; border-radius: 14px; overflow-x: auto">
      <table class="t">
        <thead><tr><th scope="col">เวลา</th><th scope="col">ผู้ทำ</th><th scope="col">บทบาท</th><th scope="col">เหตุการณ์</th><th scope="col">เลขคำขอ</th><th scope="col">สถานะก่อน → หลัง</th><th scope="col">รายละเอียด / เหตุผล</th></tr></thead>
        <tbody>
          <sc-for list="{{rows}}" as="r" hint-placeholder-count="10">
            <tr data-testid="audit-row" data-id="{{r.id}}" data-event="{{r.ev}}" data-actor="{{r.actor}}" data-case-no="{{r.caseNo}}">
              <td data-testid="audit-time" data-iso="{{r.iso}}" style="white-space: nowrap">{{r.time}}</td>
              <td data-testid="audit-actor" class="mono">{{r.actor}}</td>
              <td data-testid="audit-role" class="muted">{{r.role}}</td>
              <td data-testid="audit-event"><span class="{{r.evCls}}">{{r.ev}}</span></td>
              <td data-testid="audit-case-no" class="mono" style="white-space: nowrap">{{r.caseText}}</td>
              <td data-testid="audit-transition" class="mono" style="font-size: 13px; white-space: nowrap">{{r.tr}}</td>
              <td data-testid="audit-detail">{{r.detail}}</td>
            </tr>
          </sc-for>
        </tbody>
      </table>
    </section>
    <p class="muted" style="margin: 0">ตัวอย่างรายการจากการทดสอบหนึ่งรอบ · หลังรีเซ็ตระบบ ตารางนี้ว่างเปล่า</p>
  </main>
</div>
</script>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1200}}'>
class Component extends DCLogic {
  renderVals() {
    const raw = [
      ['10', '09:48', 'admin1', 'admin', 'ADMIN_CHANGE', '', '–', 'SV-01 fee 20 → 25'],
      ['9', '09:41', 'exec1', 'executive', 'EXPORT', '', '–', 'xlsx · period 2026-12 · ALL'],
      ['8', '09:35', 'off.reg1', 'officer', 'ISSUE', '000019', 'APPROVED → COMPLETED', 'DOC-2569-000002'],
      ['7', '09:30', 'head1', 'head', 'APPROVE', '000014', 'PENDING_APPROVAL → APPROVED', '–'],
      ['6', '09:22', 'off.works1', 'officer', 'FORWARD', '000010', 'IN_REVIEW → PENDING_APPROVAL', 'แบบแปลนผ่านการตรวจโครงสร้างแล้ว'],
      ['5', '09:15', 'off.reg1', 'officer', 'RETURN', '000022', 'IN_REVIEW → NEED_FIX', 'ภาพบัตรประชาชนไม่ชัด กรุณาถ่ายใหม่'],
      ['4', '09:12', 'off.reg1', 'officer', 'UNMASK', '000022', '–', 'ตรวจสอบกับทะเบียนราษฎร'],
      ['3', '09:08', 'off.reg1', 'officer', 'REJECT', '000023', 'IN_REVIEW → REJECTED', 'ข้อมูลในแบบฟอร์มไม่ตรงกับทะเบียนราษฎร'],
      ['2', '09:03', 'off.reg1', 'officer', 'CLAIM', '000024', 'SUBMITTED → IN_REVIEW', '–'],
      ['1', '09:01', 'off.reg1', 'officer', 'STAFF_LOGIN', '', '–', '–']
    ];
    const rows = raw.map((x) => ({
      id: x[0], time: '1 ธ.ค. 2569 ' + x[1], iso: '2026-12-01T' + x[1] + ':00+07:00',
      actor: x[2], role: x[3], ev: x[4],
      evCls: x[4] === 'UNMASK' || x[4] === 'EXPORT' ? 'ev ev-sens' : (x[4] === 'ADMIN_CHANGE' ? 'ev ev-adm' : 'ev'),
      caseNo: x[5] ? 'EG-2569-' + x[5] : '', caseText: x[5] ? 'EG-2569-' + x[5] : '–',
      tr: x[6], detail: x[7]
    }));
    return { rows };
  }
}
</script>
</body>
</html>
