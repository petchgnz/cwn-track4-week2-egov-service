<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>เข้าสู่ระบบ e-Service</title>
<script src="./support.js"></script>
</head>
<body>
<script type="text/x-dc-template">
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0;background:#F3F5F7}
*{box-sizing:border-box}
a{color:#0B5CAD}a:hover{color:#08457F}
.mono{font-family:'IBM Plex Mono',monospace}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:8px;font:600 16px/1 'IBM Plex Sans Thai',sans-serif;border:1px solid transparent;cursor:pointer;text-decoration:none}
.btn-primary{background:#0B5CAD;color:#fff}.btn-primary:hover{background:#08457F;color:#fff}
.btn-secondary{background:#fff;color:#0B5CAD;border-color:#B9CCE0}
.btn-ghost{background:transparent;color:#0B5CAD;padding:0 8px}
.label{font:600 15px/1.4 'IBM Plex Sans Thai',sans-serif;color:#13202B}
.input{width:100%;height:48px;border:1px solid #8E9AA6;border-radius:8px;padding:0 14px;font:500 18px/1 'IBM Plex Sans Thai',sans-serif;color:#13202B;background:#fff}
.input:focus{outline:3px solid #9CC3EA;outline-offset:1px;border-color:#0B5CAD}
.input-err{border-color:#A1261D;border-width:2px}
.help{font-size:14px;line-height:1.5;color:#56616C}
.tab{min-height:44px;border:0;border-radius:8px;font:600 16px/1 'IBM Plex Sans Thai',sans-serif;cursor:pointer;background:transparent;color:#3D4853}.tab-on{background:#FFFFFF;color:#0B5CAD;box-shadow:0 1px 3px rgba(19,32,43,0.15)}
.err{font-size:14px;line-height:1.5;color:#A1261D;display:flex;gap:8px;align-items:flex-start;font-weight:500}
</style>
</helmet>
<div style="min-height: 960px; background: #F3F5F7; font-family: 'IBM Plex Sans Thai', sans-serif; color: #13202B; display: flex; flex-direction: column">
  <header style="background: #FFFFFF; border-bottom: 1px solid #DCE2E8">
    <div style="max-width: 1200px; margin: 0 auto; padding: 14px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px">
      <a href="Main.html" style="display: flex; align-items: center; gap: 12px; text-decoration: none; color: #13202B">
        <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="19" fill="#0B5CAD"></circle><path d="M11 17h18M12 28h16M13 17v9M18 17v9M22 17v9M27 17v9M10 31h20M20 9l10 6H10z" stroke="#fff" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round"></path></svg>
        <span style="display: flex; flex-direction: column; line-height: 1.25"><strong style="font-size: 17px">e-Service กลาง</strong><span style="font-size: 13px; color: #56616C">เทศบาลนครตัวอย่าง</span></span>
      </a>
      <div style="margin-left: auto; display: flex; align-items: center; gap: 16px; flex-wrap: wrap">
        <a href="Verify.html" style="font-size: 15px; font-weight: 500">ตรวจสอบเอกสารราชการ</a>
        <span style="font-size: 13px; padding: 4px 10px; border-radius: 999px; background: #FFF4E0; color: #7A4100; border: 1px solid #F1D3A1">โหมดทดสอบ · 1 ธ.ค. 2569 09:00</span>
      </div>
    </div>
  </header>

  <main style="flex: 1; width: 100%; max-width: 1200px; margin: 0 auto; padding: 48px 24px; display: flex; flex-wrap: wrap; gap: 40px; align-items: stretch">
    <section style="flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 28px">
      <div style="display: flex; flex-direction: column; gap: 12px">
        <p style="margin: 0; font-size: 15px; font-weight: 600; color: #0B5CAD">บริการออนไลน์ตลอด 24 ชั่วโมง</p>
        <h1 style="margin: 0; font-size: 40px; line-height: 1.25; font-weight: 700">ติดต่อเทศบาลได้<br>โดยไม่ต้องเดินทาง</h1>
        <p style="margin: 0; font-size: 18px; line-height: 1.6; color: #3D4853; max-width: 480px">ยื่นคำขอ แนบเอกสาร ชำระค่าธรรมเนียม และติดตามสถานะได้จากที่บ้าน</p>
      </div>
      <ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 14px">
        <li style="display: flex; gap: 14px; align-items: flex-start">
          <span style="flex: none; width: 40px; height: 40px; border-radius: 10px; background: #E3EEF9; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0B5CAD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><path d="M14 3v6h6M9 14h6M9 18h4"></path></svg></span>
          <span style="display: flex; flex-direction: column; gap: 2px"><strong style="font-size: 16px">3 บริการ</strong><span class="help">หนังสือรับรอง · ประกอบกิจการ · ก่อสร้าง/ต่อเติมอาคาร</span></span>
        </li>
        <li style="display: flex; gap: 14px; align-items: flex-start">
          <span style="flex: none; width: 40px; height: 40px; border-radius: 10px; background: #E3EEF9; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0B5CAD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect><path d="M14 14h3v3h-3zM20 14v.01M14 20h.01M17 20h4v-3"></path></svg></span>
          <span style="display: flex; flex-direction: column; gap: 2px"><strong style="font-size: 16px">ชำระด้วย PromptPay QR</strong><span class="help">ได้เลขคำขอและใบเสร็จทันทีเมื่อชำระสำเร็จ</span></span>
        </li>
        <li style="display: flex; gap: 14px; align-items: flex-start">
          <span style="flex: none; width: 40px; height: 40px; border-radius: 10px; background: #E3EEF9; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0B5CAD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><path d="M9 12l2 2 4-4"></path></svg></span>
          <span style="display: flex; flex-direction: column; gap: 2px"><strong style="font-size: 16px">ข้อมูลส่วนบุคคลเข้ารหัสตาม PDPA</strong><span class="help">เจ้าหน้าที่เห็นเลขบัตรแบบปิดบังเท่านั้น</span></span>
        </li>
      </ul>
    </section>

    <section aria-labelledby="login-title" style="flex: 1 1 440px; min-width: 0; max-width: 520px; background: #FFFFFF; border: 1px solid #DCE2E8; border-radius: 16px; padding: 32px; display: flex; flex-direction: column; gap: 24px; box-shadow: 0 8px 24px rgba(19,32,43,0.06)">
      <h2 id="login-title" style="margin: 0; font-size: 24px; font-weight: 700">เข้าสู่ระบบ</h2>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; background: #EDF1F4; border-radius: 10px">
        <button type="button" aria-pressed="{{citizenPressed}}" onClick="{{goCitizen}}" class="{{citizenTabClass}}">ประชาชน</button>
        <button type="button" aria-pressed="{{staffPressed}}" onClick="{{goStaff}}" class="{{staffTabClass}}">เจ้าหน้าที่</button>
      </div>

      <sc-if value="{{showId}}" hint-placeholder-val="{{ true }}">
        <form style="display: flex; flex-direction: column; gap: 20px" onSubmit="{{noSubmit}}">
          <div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: #F3F7FB; border-radius: 10px; border: 1px solid #D7E4F1">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#0B5CAD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="9" cy="12" r="2.5"></circle><path d="M14 10h4M14 14h3"></path></svg>
            <span style="font-size: 15px; line-height: 1.5">ยืนยันตัวตนด้วย <strong>ThaiD (จำลอง)</strong> ไม่ต้องไปที่เทศบาล</span>
          </div>
          <div style="display: flex; flex-direction: column; gap: 8px">
            <label class="label" for="thaid-id">เลขประจำตัวประชาชน 13 หลัก</label>
            <input id="thaid-id" class="{{idInputClass}}" data-testid="thaid-id-input" inputmode="numeric" maxlength="13" autocomplete="off" value="{{idValue}}" placeholder="เช่น 1101700123456">
            <sc-if value="{{idError}}" hint-placeholder-val="{{ false }}">
              <p class="err" data-testid="thaid-error" style="margin: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex: none; margin-top: 2px"><circle cx="12" cy="12" r="10"></circle><path d="M12 7v6M12 17h.01"></path></svg>เลขบัตรประชาชนไม่ถูกต้อง</p>
            </sc-if>
            <span class="help">ตัวเลข 13 หลัก ไม่ต้องใส่ขีด ระบบตรวจหลักสุดท้าย (checksum)</span>
          </div>
          <button type="button" class="btn btn-primary" onClick="{{toOtp}}">ขอรหัส OTP</button>
        </form>
      </sc-if>

      <sc-if value="{{showOtp}}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; flex-direction: column; gap: 20px">
          <div style="display: flex; flex-direction: column; gap: 4px">
            <span class="help">ส่งรหัส OTP ไปยังแอป ThaiD ของ</span>
            <span class="mono" style="font-size: 18px">1-1017-00123-45-6</span>
            <button type="button" class="btn btn-ghost" onClick="{{backToId}}" style="align-self: flex-start; min-height: 44px; padding: 0; font-size: 15px">เปลี่ยนเลขบัตร</button>
          </div>
          <sc-if value="{{notLocked}}" hint-placeholder-val="{{ true }}">
            <div style="display: flex; flex-direction: column; gap: 8px">
              <label class="label" for="otp">รหัส OTP 6 หลัก</label>
              <input id="otp" class="{{otpInputClass}}" data-testid="otp-input" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="••••••" style="letter-spacing: 0.5em; font-size: 22px; font-family: 'IBM Plex Mono', monospace">
              <sc-if value="{{otpError}}" hint-placeholder-val="{{ false }}">
                <p class="err" data-testid="otp-error" style="margin: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex: none; margin-top: 2px"><circle cx="12" cy="12" r="10"></circle><path d="M12 7v6M12 17h.01"></path></svg><span>รหัส OTP ไม่ถูกต้อง · เหลืออีก 2 ครั้งก่อนถูกล็อก</span></p>
              </sc-if>
              <span style="align-self: flex-start; font-size: 13px; padding: 4px 10px; border-radius: 6px; background: #FFF4E0; color: #7A4100">โหมดทดสอบ: OTP คือ <span class="mono">123456</span></span>
            </div>
            <a href="CitizenHome.html" class="btn btn-primary">เข้าสู่ระบบ</a>
          </sc-if>
          <sc-if value="{{locked}}" hint-placeholder-val="{{ false }}">
            <div data-testid="lock-message" role="alert" style="display: flex; gap: 12px; padding: 16px; border-radius: 10px; background: #FBE9E7; border: 1px solid #E8B4AE; color: #7E1D16">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex: none"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
              <span style="display: flex; flex-direction: column; gap: 4px"><strong style="font-size: 16px">ผิดเกินกำหนด เลขบัตรนี้ถูกล็อก 15 นาที</strong><span style="font-size: 14px">ลองใหม่ได้ตั้งแต่ 1 ธ.ค. 2569 09:15</span></span>
            </div>
            <button type="button" class="btn" disabled="{{ true }}">เข้าสู่ระบบ</button>
          </sc-if>
        </div>
      </sc-if>

      <sc-if value="{{isStaff}}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; flex-direction: column; gap: 20px">
          <div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: #F3F7FB; border-radius: 10px; border: 1px solid #D7E4F1">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#0B5CAD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18M5 21V10l7-5 7 5v11M9 21v-6h6v6"></path></svg>
            <span style="font-size: 15px; line-height: 1.5">เจ้าหน้าที่ · หัวหน้าฝ่าย · ผู้บริหาร · ผู้ตรวจสอบ · ผู้ดูแลระบบ</span>
          </div>
          <div style="display: flex; flex-direction: column; gap: 8px">
            <label class="label" for="staff-user">ชื่อผู้ใช้</label>
            <input id="staff-user" class="input" data-testid="staff-username" autocomplete="username" placeholder="เช่น off.reg1">
          </div>
          <div style="display: flex; flex-direction: column; gap: 8px">
            <label class="label" for="staff-pass">รหัสผ่าน</label>
            <input id="staff-pass" class="input" type="password" data-testid="staff-password" autocomplete="current-password">
            <sc-if value="{{staffError}}" hint-placeholder-val="{{ false }}">
              <p class="err" data-testid="staff-error" style="margin: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex: none; margin-top: 2px"><circle cx="12" cy="12" r="10"></circle><path d="M12 7v6M12 17h.01"></path></svg>ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง</p>
            </sc-if>
          </div>
          <a href="OfficerQueue.html" class="btn btn-primary" data-testid="staff-login-btn">เข้าสู่ระบบเจ้าหน้าที่ (SSO ภาครัฐ จำลอง)</a>
          <span class="help">ระบบพาไปหน้าตามบทบาท: เจ้าหน้าที่ → คิวงาน · หัวหน้า → รออนุมัติ · ผู้บริหาร → Dashboard · ผู้ตรวจ → Audit · ผู้ดูแล → บริการ</span>
        </div>
      </sc-if>
    </section>
  </main>

  <footer style="border-top: 1px solid #DCE2E8; background: #FFFFFF">
    <div style="max-width: 1200px; margin: 0 auto; padding: 18px 24px; display: flex; flex-wrap: wrap; gap: 8px 24px; font-size: 14px; color: #56616C">
      <span>ระบบจำลองเพื่อการเรียนรู้ ไม่เชื่อมต่อ ThaiD ธนาคาร หรือหน่วยงานจริง</span>
      <a href="#" style="margin-left: auto">นโยบายคุ้มครองข้อมูลส่วนบุคคล</a>
      <a href="#">การเข้าถึงสำหรับผู้พิการ</a>
    </div>
  </footer>
</div>
</script>
<script type="text/x-dc" data-dc-script data-props='{"demoState":{"editor":"enum","options":["none","id-error","otp-error","locked","staff-error"],"default":"none","section":"ตัวอย่างสถานะ"},"$preview":{"width":1280,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const ds = this.props.demoState ?? 'none';
    const tab = s.tab ?? (ds === 'staff-error' ? 'staff' : 'citizen');
    const step = s.step ?? ((ds === 'otp-error' || ds === 'locked') ? 'otp' : 'id');
    return {
      isStaff: tab === 'staff',
      showId: tab === 'citizen' && step === 'id',
      showOtp: tab === 'citizen' && step === 'otp',
      idError: ds === 'id-error',
      otpError: ds === 'otp-error',
      locked: ds === 'locked',
      notLocked: ds !== 'locked',
      staffError: ds === 'staff-error',
      idValue: ds === 'id-error' ? '1101700123457' : '',
      idInputClass: ds === 'id-error' ? 'input input-err mono' : 'input mono',
      otpInputClass: ds === 'otp-error' ? 'input input-err' : 'input',
      citizenTabClass: tab === 'citizen' ? 'tab tab-on' : 'tab',
      staffTabClass: tab === 'staff' ? 'tab tab-on' : 'tab',
      citizenPressed: String(tab === 'citizen'),
      staffPressed: String(tab === 'staff'),
      goCitizen: () => this.setState({ tab: 'citizen' }),
      goStaff: () => this.setState({ tab: 'staff' }),
      toOtp: () => this.setState({ step: 'otp' }),
      backToId: () => this.setState({ step: 'id' }),
      noSubmit: (e) => { if (e && e.preventDefault) e.preventDefault(); }
    };
  }
}
</script>
</body>
</html>
