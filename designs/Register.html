<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>ลงทะเบียนครั้งแรก</title>
<script src="./support.js"></script>
</head>
<body>
<script type="text/x-dc-template">
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0;background:#F3F5F7}
*{box-sizing:border-box}
a{color:#0B5CAD}a:hover{color:#08457F}
.mono{font-family:'IBM Plex Mono',monospace}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:8px;font:600 16px/1 'IBM Plex Sans Thai',sans-serif;border:1px solid transparent;cursor:pointer;text-decoration:none}
.btn-primary{background:#0B5CAD;color:#fff}.btn-primary:hover{background:#08457F;color:#fff}
.btn-secondary{background:#fff;color:#0B5CAD;border-color:#B9CCE0}
.label{font:600 15px/1.4 'IBM Plex Sans Thai',sans-serif;color:#13202B}
.input{width:100%;height:48px;border:1px solid #8E9AA6;border-radius:8px;padding:0 14px;font:500 17px/1 'IBM Plex Sans Thai',sans-serif;color:#13202B;background:#fff}
.input:focus{outline:3px solid #9CC3EA;outline-offset:1px;border-color:#0B5CAD}
.input-err{border-color:#A1261D;border-width:2px}
.input-ro{background:#F1F3F5;color:#3D4853;border-color:#C9D1D8}
.help{font-size:14px;line-height:1.5;color:#56616C}
.err{font-size:14px;line-height:1.5;color:#A1261D;display:flex;gap:8px;align-items:flex-start;font-weight:500;margin:0}
.opt{font-weight:400;color:#56616C}
</style>
</helmet>
<div style="min-height: 960px; background: #F3F5F7; font-family: 'IBM Plex Sans Thai', sans-serif; color: #13202B">
  <header style="background: #FFFFFF; border-bottom: 1px solid #DCE2E8">
    <div style="max-width: 1200px; margin: 0 auto; padding: 14px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px">
      <a href="Main.html" style="display: flex; align-items: center; gap: 12px; text-decoration: none; color: #13202B">
        <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="19" fill="#0B5CAD"></circle><path d="M11 17h18M12 28h16M13 17v9M18 17v9M22 17v9M27 17v9M10 31h20M20 9l10 6H10z" stroke="#fff" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round"></path></svg>
        <span style="display: flex; flex-direction: column; line-height: 1.25"><strong style="font-size: 17px">e-Service กลาง</strong><span style="font-size: 13px; color: #56616C">เทศบาลนครตัวอย่าง</span></span>
      </a>
      <div style="margin-left: auto; display: flex; align-items: center; gap: 16px">
        <span data-testid="user-name" style="font-size: 15px; font-weight: 500">มานะ ตั้งใจ</span>
        <a href="Main.html" style="font-size: 15px">ออกจากระบบ</a>
      </div>
    </div>
  </header>

  <main style="max-width: 720px; margin: 0 auto; padding: 40px 24px 56px; display: flex; flex-direction: column; gap: 24px">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <p style="margin: 0; font-size: 15px; font-weight: 600; color: #0B5CAD">เข้าใช้งานครั้งแรก</p>
      <h1 style="margin: 0; font-size: 32px; line-height: 1.3">ลงทะเบียนเพื่อใช้บริการ</h1>
      <p style="margin: 0; font-size: 17px; line-height: 1.6; color: #3D4853">ยืนยันข้อมูลจาก ThaiD และเพิ่มเบอร์มือถือ ทำครั้งเดียว ครั้งต่อไปเข้าใช้ได้ทันที</p>
    </div>

    <form style="background: #FFFFFF; border: 1px solid #DCE2E8; border-radius: 16px; padding: 32px; display: flex; flex-direction: column; gap: 24px">
      <fieldset style="border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 16px">
        <legend style="font-size: 18px; font-weight: 700; padding: 0; margin-bottom: 16px; display: flex; align-items: center; gap: 8px">ข้อมูลจาก ThaiD
          <span style="font-size: 13px; font-weight: 500; color: #3D4853; background: #EDF1F4; border-radius: 999px; padding: 3px 10px; display: inline-flex; align-items: center; gap: 6px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>แก้ไขไม่ได้</span>
        </legend>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px">
          <div style="display: flex; flex-direction: column; gap: 8px">
            <label class="label" for="reg-name">ชื่อ-นามสกุล</label>
            <input id="reg-name" class="input input-ro" data-testid="reg-name" value="มานะ ตั้งใจ" readonly>
          </div>
          <div style="display: flex; flex-direction: column; gap: 8px">
            <label class="label" for="reg-id">เลขประจำตัวประชาชน</label>
            <input id="reg-id" class="input input-ro mono" value="5-5004-00111-22-1" readonly>
          </div>
        </div>
      </fieldset>

      <hr style="border: 0; border-top: 1px solid #E4E8EC; margin: 0">

      <fieldset style="border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 16px">
        <legend style="font-size: 18px; font-weight: 700; padding: 0; margin-bottom: 16px">ช่องทางติดต่อ</legend>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <label class="label" for="reg-mobile">เบอร์มือถือ <span style="color: #A1261D">*</span></label>
          <input id="reg-mobile" class="{{mobileClass}}" data-testid="reg-mobile" inputmode="numeric" maxlength="10" value="{{mobileValue}}" placeholder="0812345678" aria-describedby="mobile-help">
          <sc-if value="{{showErrors}}" hint-placeholder-val="{{ false }}">
            <p class="err" data-testid="reg-error-mobile"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex: none; margin-top: 2px"><circle cx="12" cy="12" r="10"></circle><path d="M12 7v6M12 17h.01"></path></svg>เบอร์มือถือต้องเป็นตัวเลข 10 หลักขึ้นต้นด้วย 0</p>
          </sc-if>
          <span id="mobile-help" class="help">ตัวเลข 10 หลัก ขึ้นต้นด้วย 0</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <label class="label" for="reg-email">อีเมล <span class="opt">(ไม่บังคับ)</span></label>
          <input id="reg-email" class="input" data-testid="reg-email" type="email" placeholder="name@example.com">
        </div>
      </fieldset>

      <hr style="border: 0; border-top: 1px solid #E4E8EC; margin: 0">

      <fieldset style="border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 14px">
        <legend style="font-size: 18px; font-weight: 700; padding: 0; margin-bottom: 14px">การคุ้มครองข้อมูลส่วนบุคคล (PDPA)</legend>
        <div style="background: #F7F9FA; border: 1px solid #E4E8EC; border-radius: 10px; padding: 16px 18px; font-size: 15px; line-height: 1.7; color: #3D4853">
          เทศบาลนครตัวอย่างเก็บเลขบัตร ชื่อ เบอร์มือถือ และเอกสารที่แนบ เพื่อพิจารณาคำขอและติดต่อกลับเท่านั้น
          <ul style="margin: 8px 0 0; padding-left: 20px">
            <li>ข้อมูลเข้ารหัสทั้งขณะจัดเก็บและส่งผ่านเครือข่าย</li>
            <li>เจ้าหน้าที่เห็นเลขบัตรแบบปิดบัง การเปิดดูเลขเต็มถูกบันทึกทุกครั้ง</li>
          </ul>
        </div>
        <label style="display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border: 1px solid {{consentBorder}}; border-radius: 10px; cursor: pointer; font-size: 16px; line-height: 1.5">
          <input type="checkbox" data-testid="reg-consent" style="width: 22px; height: 22px; margin: 1px 0 0; flex: none; accent-color: #0B5CAD">
          <span>ข้าพเจ้ายินยอมให้เทศบาลประมวลผลข้อมูลส่วนบุคคลตามวัตถุประสงค์ข้างต้น <span style="color: #A1261D">*</span></span>
        </label>
        <sc-if value="{{showErrors}}" hint-placeholder-val="{{ false }}">
          <p class="err" data-testid="reg-error-consent"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex: none; margin-top: 2px"><circle cx="12" cy="12" r="10"></circle><path d="M12 7v6M12 17h.01"></path></svg>กรุณายินยอมการประมวลผลข้อมูลส่วนบุคคล (PDPA)</p>
        </sc-if>
      </fieldset>

      <div style="display: flex; flex-wrap: wrap; gap: 12px; justify-content: flex-end">
        <a href="Main.html" class="btn btn-secondary">ยกเลิก</a>
        <a href="CitizenHome.html" class="btn btn-primary" data-testid="reg-submit-btn">ลงทะเบียน</a>
      </div>
    </form>
  </main>
</div>
</script>
<script type="text/x-dc" data-dc-script data-props='{"showErrors":{"editor":"boolean","default":false,"section":"ตัวอย่างสถานะ"},"$preview":{"width":1280,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    const e = this.props.showErrors ?? false;
    return {
      showErrors: e,
      mobileValue: e ? '081234567' : '',
      mobileClass: e ? 'input input-err mono' : 'input mono',
      consentBorder: e ? '#A1261D' : '#C9D1D8'
    };
  }
}
</script>
</body>
</html>
