<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>รายละเอียดคำขอ</title>
<script src="./support.js"></script>
</head>
<body>
<script type="text/x-dc-template">
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0;background:#F3F5F7}
*{box-sizing:border-box}
a{color:#0B5CAD}a:hover{color:#08457F}
.mono{font-family:'IBM Plex Mono',monospace}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:8px;font:600 16px/1 'IBM Plex Sans Thai',sans-serif;border:1px solid transparent;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn-primary{background:#0B5CAD;color:#fff}.btn-primary:hover{background:#08457F;color:#fff}
.btn-secondary{background:#fff;color:#0B5CAD;border-color:#B9CCE0}
.btn-danger{background:#fff;color:#A1261D;border-color:#E3B4AF}
.btn-danger-solid{background:#A1261D;color:#fff}
.btn-sm{min-height:40px;padding:0 14px;font-size:14px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;font:600 14px/1.4 'IBM Plex Sans Thai',sans-serif;white-space:nowrap;border:1px solid transparent}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.st-SUBMITTED{background:#E3EEF9;color:#0A4A8A;border-color:#B9CCE0}
.st-NEED_FIX{background:#FDEBD3;color:#8A3F00;border-color:#F0C48E}
.st-REJECTED{background:#FBE7E6;color:#9B2219;border-color:#EDBBB6}
.sla{display:inline-flex;align-items:center;gap:6px;font:600 14px/1.4 'IBM Plex Sans Thai',sans-serif;white-space:nowrap}
.sla-normal{color:#3D4853}.sla-paused{color:#56616C}.sla-closed{color:#56616C}
.muted{color:#56616C;font-size:14px}
.card{background:#FFFFFF;border:1px solid #DCE2E8;border-radius:16px;padding:24px}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl li{display:grid;grid-template-columns:20px 1fr;gap:14px;padding-bottom:18px;position:relative}
.tl li::before{content:'';position:absolute;left:9px;top:20px;bottom:0;width:2px;background:#E4E8EC}
.tl li:last-child::before{display:none}
.tl .pt{width:20px;height:20px;border-radius:50%;border:3px solid #0B5CAD;background:#fff;margin-top:2px}
.tl .pt-warn{border-color:#B35C00}
.tl .pt-cur{background:#B35C00;border-color:#B35C00}
.doc{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid #E4E8EC;border-radius:10px}
textarea{width:100%;min-height:88px;border:1px solid #8E9AA6;border-radius:8px;padding:12px 14px;font:16px/1.5 'IBM Plex Sans Thai',sans-serif;color:#13202B;resize:vertical}
</style>
</helmet>
<div style="min-height: 1400px; background: #F3F5F7; font-family: 'IBM Plex Sans Thai', sans-serif; color: #13202B">
  <header style="background: #FFFFFF; border-bottom: 1px solid #DCE2E8">
    <div style="max-width: 1200px; margin: 0 auto; padding: 14px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px">
      <a href="Main.html" style="display: flex; align-items: center; gap: 12px; text-decoration: none; color: #13202B">
        <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="19" fill="#0B5CAD"></circle><path d="M11 17h18M12 28h16M13 17v9M18 17v9M22 17v9M27 17v9M10 31h20M20 9l10 6H10z" stroke="#fff" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round"></path></svg>
        <span style="display: flex; flex-direction: column; line-height: 1.25"><strong style="font-size: 17px">e-Service กลาง</strong><span style="font-size: 13px; color: #56616C">เทศบาลนครตัวอย่าง</span></span>
      </a>
      <div style="margin-left: auto; display: flex; align-items: center; gap: 16px">
        <span data-testid="user-name" data-role="citizen" style="font-size: 15px; font-weight: 500">สมชาย ใจดี</span>
        <a href="Main.html" style="font-size: 15px">ออกจากระบบ</a>
      </div>
    </div>
  </header>

  <main style="max-width: 1200px; margin: 0 auto; padding: 24px 24px 56px; display: flex; flex-direction: column; gap: 24px">
    <a href="CitizenHome.html" style="font-size: 15px; display: inline-flex; align-items: center; gap: 6px; align-self: flex-start; min-height: 44px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>คำขอของฉัน</a>

    <sc-if value="{{notFound}}" hint-placeholder-val="{{ false }}">
      <div class="card" style="padding: 56px 24px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#56616C" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M21 21l-5-5M8.5 8.5l5 5M13.5 8.5l-5 5"></path></svg>
        <h1 data-testid="not-found-msg" style="margin: 0; font-size: 26px">ไม่พบคำขอ</h1>
        <p class="muted" style="margin: 0; font-size: 16px">ตรวจสอบเลขคำขออีกครั้ง หรือกลับไปที่รายการคำขอของคุณ</p>
        <a href="CitizenHome.html" class="btn btn-secondary">กลับไปคำขอของฉัน</a>
      </div>
    </sc-if>

    <sc-if value="{{found}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-direction: column; gap: 24px">
        <section class="card" style="display: flex; flex-direction: column; gap: 20px">
          <div style="display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center">
            <h1 style="margin: 0; font-size: 28px" class="mono" data-testid="case-no">{{caseNo}}</h1>
            <span class="{{badgeCls}}" data-testid="case-status" data-status="{{status}}"><span class="dot"></span>{{statusText}}</span>
          </div>
          <dl style="margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px">
            <div><dt class="muted">บริการ</dt><dd style="margin: 4px 0 0; font-size: 16px; font-weight: 600" data-testid="case-service">{{service}}</dd></div>
            <div><dt class="muted">ค่าธรรมเนียม (ชำระแล้ว)</dt><dd style="margin: 4px 0 0; font-size: 16px; font-weight: 600" data-testid="case-fee">฿20</dd></div>
            <div><dt class="muted">กำหนดเสร็จ</dt><dd style="margin: 4px 0 0; font-size: 16px; font-weight: 600" data-testid="sla-due" data-iso="{{dueIso}}">{{due}}</dd></div>
            <div><dt class="muted">ระดับเตือน</dt><dd style="margin: 4px 0 0"><span class="{{slaCls}}" data-testid="sla-level" data-level="{{slaCode}}">{{slaText}}</span></dd></div>
          </dl>
          <p class="muted" style="margin: 0">เลขบัตรประชาชน <span class="mono" data-testid="case-id-full" style="color: #13202B">1-1017-00123-45-6</span> · ใบเสร็จ <span class="mono" style="color: #13202B">{{receipt}}</span></p>
        </section>

        <div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
          <div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 24px">

            <sc-if value="{{isNeedFix}}" hint-placeholder-val="{{ true }}">
              <section aria-labelledby="fix-title" style="background: #FFFFFF; border: 2px solid #E0A458; border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 18px">
                <div style="display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: flex-start">
                  <h2 id="fix-title" style="margin: 0; font-size: 21px; display: flex; gap: 10px; align-items: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8A3F00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path><path d="M12 9v4M12 17h.01"></path></svg>ต้องแก้ไขเอกสาร</h2>
                  <div style="text-align: right">
                    <div class="muted">ส่งแก้ไขภายใน</div>
                    <div data-testid="fix-deadline" data-iso="2026-12-04T14:00:00+07:00" style="font-size: 18px; font-weight: 700; color: #8A3F00">4 ธ.ค. 2569 14:00</div>
                    <div class="muted">เหลือ 3 วัน 5 ชั่วโมง</div>
                  </div>
                </div>
                <div style="padding: 14px 16px; border-radius: 10px; background: #FDF3E6">
                  <div class="muted" style="color: #5E3200">เหตุผลจากเจ้าหน้าที่ (ตีกลับครั้งที่ 2 จาก 2)</div>
                  <p data-testid="return-reason-display" style="margin: 6px 0 0; font-size: 17px; font-weight: 600; color: #3E1E00">ชื่อในเอกสารไม่ตรงกับบัตร กรุณาแก้ไข</p>
                </div>
                <div style="display: flex; flex-direction: column; gap: 8px">
                  <span style="font-size: 15px; font-weight: 600">แนบไฟล์ใหม่ <span class="muted" style="font-weight: 400">(ไม่บังคับ)</span></span>
                  <div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 14px; border: 1px dashed #A9B3BD; border-radius: 10px; background: #FAFBFC">
                    <button type="button" class="btn btn-secondary btn-sm" data-testid="fix-upload-input"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"></path></svg>เลือกไฟล์</button>
                    <span class="muted">PDF, JPG, PNG ไม่เกิน 5 MB</span>
                  </div>
                </div>
                <p class="muted" style="margin: 0">ระหว่างรอแก้ไข ระบบหยุดนับระยะเวลา (SLA) · ถ้าไม่ส่งภายในเวลา ระบบจะยกเลิกคำขอ และไม่คืนค่าธรรมเนียม</p>
                <button type="button" class="btn btn-primary" data-testid="submit-fix-btn" style="align-self: flex-start">ส่งแก้ไข</button>
              </section>
            </sc-if>

            <sc-if value="{{isSubmitted}}" hint-placeholder-val="{{ false }}">
              <section class="card" style="display: flex; flex-direction: column; gap: 16px">
                <h2 style="margin: 0; font-size: 20px">รอเจ้าหน้าที่รับเรื่อง</h2>
                <p class="muted" style="margin: 0; font-size: 15px">ยังยกเลิกได้จนกว่าเจ้าหน้าที่จะรับเรื่อง</p>
                <button type="button" class="btn btn-danger" data-testid="cancel-case-btn" style="align-self: flex-start">ยกเลิกคำขอ</button>
                <div role="dialog" aria-modal="false" aria-labelledby="cc-title" style="border: 1px solid #EDBBB6; background: #FFF8F7; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 14px">
                  <h3 id="cc-title" style="margin: 0; font-size: 18px">ยืนยันยกเลิกคำขอ EG-2569-000030?</h3>
                  <p data-testid="cancel-confirm-text" style="margin: 0; font-size: 16px; font-weight: 600; color: #7E1D16">ค่าธรรมเนียมที่ชำระแล้วไม่คืน</p>
                  <div style="display: flex; flex-wrap: wrap; gap: 10px">
                    <button type="button" class="btn btn-danger-solid btn-sm" data-testid="confirm-cancel-btn">ยืนยันยกเลิก</button>
                    <button type="button" class="btn btn-secondary btn-sm">ไม่ยกเลิก</button>
                  </div>
                </div>
              </section>
            </sc-if>

            <sc-if value="{{isRejected}}" hint-placeholder-val="{{ false }}">
              <section class="card" style="display: flex; flex-direction: column; gap: 12px; border-color: #EDBBB6">
                <h2 style="margin: 0; font-size: 20px">ผลการพิจารณา: ไม่อนุมัติ</h2>
                <p style="margin: 0; font-size: 16px">เหตุผล: เอกสารรับรองไม่สอดคล้องกับข้อมูลทะเบียนบ้าน</p>
                <p class="muted" style="margin: 0">ปิดงาน <span data-testid="closed-at" data-iso="2026-11-11T09:00:00+07:00">11 พ.ย. 2569 09:00</span></p>
                <p data-testid="no-refund-note" style="margin: 0; padding: 12px 14px; border-radius: 8px; background: #FBE7E6; color: #7E1D16; font-weight: 600">ค่าธรรมเนียมที่ชำระแล้วไม่คืน</p>
              </section>
            </sc-if>

            <section class="card" aria-labelledby="tl-title" style="display: flex; flex-direction: column; gap: 18px">
              <h2 id="tl-title" style="margin: 0; font-size: 20px">ความคืบหน้า</h2>
              <ol class="tl" data-testid="case-timeline">
                <sc-for list="{{timeline}}" as="t" hint-placeholder-count="5">
                  <li data-testid="timeline-item" data-iso="{{t.iso}}">
                    <span class="{{t.pt}}" aria-hidden="true"></span>
                    <div style="display: flex; flex-direction: column; gap: 2px">
                      <strong style="font-size: 15px">{{t.title}}</strong>
                      <span class="muted">{{t.when}}</span>
                      <span style="font-size: 14px; color: #3D4853">{{t.note}}</span>
                    </div>
                  </li>
                </sc-for>
              </ol>
            </section>
          </div>

          <aside style="flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 24px">
            <section class="card" aria-labelledby="docs-title" style="display: flex; flex-direction: column; gap: 12px">
              <h2 id="docs-title" style="margin: 0; font-size: 18px">เอกสารที่แนบ</h2>
              <div class="doc" data-testid="doc-item" data-name="id-card.pdf" data-file-id="f-017-1">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0B5CAD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><path d="M14 3v6h6"></path></svg>
                <span style="flex: 1; display: flex; flex-direction: column"><span style="font-weight: 600; font-size: 15px">บัตรประชาชน</span><span class="muted">id-card.pdf · 182 KB</span></span>
                <a href="#" data-testid="doc-download-link" aria-label="ดาวน์โหลด id-card.pdf" style="min-width: 44px; min-height: 44px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"></path></svg></a>
              </div>
            </section>
            <section class="card" aria-labelledby="pay-title" style="display: flex; flex-direction: column; gap: 10px">
              <h2 id="pay-title" style="margin: 0; font-size: 18px">การชำระเงิน</h2>
              <dl style="margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; font-size: 15px">
                <dt class="muted">ใบเสร็จ</dt><dd style="margin: 0" class="mono">{{receipt}}</dd>
                <dt class="muted">ยอด</dt><dd style="margin: 0">฿20 · PromptPay</dd>
                <dt class="muted">ชำระเมื่อ</dt><dd style="margin: 0">{{paidAt}}</dd>
              </dl>
              <button type="button" class="btn btn-secondary btn-sm" style="align-self: flex-start">ดาวน์โหลดใบเสร็จ</button>
            </section>
          </aside>
        </div>
      </div>
    </sc-if>
  </main>
</div>
</script>

    const data = {

          { title: 'ส่งแก้ไขแล้ว', when: '25 พ.ย. 2569 10:00', note: 'แนบภาพบัตรใหม่', iso: '2026-11-25T10:00:00+07:00', pt: 'pt' },

          { title: 'เจ้าหน้าที่รับเรื่อง', when: '23 พ.ย. 2569 13:00', note: 'ฝ่ายทะเบียน', iso: '2026-11-23T13:00:00+07:00', pt: 'pt' },
          { title: 'ชำระเงินและส่งคำขอแล้ว', when: '23 พ.ย. 2569 10:00', note: 'ใบเสร็จ RC-2569-000017', iso: '2026-11-23T10:00:00+07:00', pt: 'pt' }

        ]
      },
      rejected: {
        caseNo: 'EG-2569-000008', status: 'REJECTED', statusText: 'ไม่อนุมัติ', badgeCls: 'badge st-REJECTED',
        due: '12 พ.ย. 2569 16:30', dueIso: '2026-11-12T16:30:00+07:00', slaCode: 'closed', slaText: 'ปิดแล้ว', slaCls: 'sla sla-closed',
        receipt: 'RC-2569-000008', paidAt: '9 พ.ย. 2569 10:00',
        timeline: [
          { title: 'ไม่อนุมัติ', when: '11 พ.ย. 2569 09:00', note: 'เอกสารรับรองไม่สอดคล้องกับข้อมูลทะเบียนบ้าน', iso: '2026-11-11T09:00:00+07:00', pt: 'pt pt-warn' },
          { title: 'เจ้าหน้าที่รับเรื่อง', when: '9 พ.ย. 2569 13:00', note: 'ฝ่ายทะเบียน', iso: '2026-11-09T13:00:00+07:00', pt: 'pt' },
          { title: 'ชำระเงินและส่งคำขอแล้ว', when: '9 พ.ย. 2569 10:00', note: 'ใบเสร็จ RC-2569-000008', iso: '2026-11-09T10:00:00+07:00', pt: 'pt' }

    };
    const d = data[v] || data['need-fix'];
    return Object.assign({}, d, {
      service: 'SV-01 ขอหนังสือรับรอง',
      notFound: v === 'not-found', found: v !== 'not-found',
      isNeedFix: v === 'need-fix', isSubmitted: v === 'submitted', isRejected: v === 'rejected'

  }
}
</script>
</body>
</html>
